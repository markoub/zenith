name: 🧐 Reviewer — review, approve & merge

# Wakes when a PR is labeled `needs-review`. Claude reviews the diff and either
# approves (label `ready-to-merge`) or requests changes. If approved, the final
# step waits for CI to go green and squash-merges — which triggers the deploy.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Run the Reviewer agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the default GITHUB_TOKEN so the review is submitted as a *different*
          # identity than the PR author (you can't approve your own PR).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the Senior Reviewer for the Zenith project.
            Read `.github/agents/reviewer.md` and follow it exactly.
            Repository: ${{ github.repository }}.
            Review pull request #${{ github.event.pull_request.number }}.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools Bash,Edit,Read,Write,Glob,Grep

      - name: Merge when approved & CI green
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          echo "Labels on PR #$PR: $labels"
          if echo "$labels" | grep -q 'ready-to-merge'; then
            echo "✅ Reviewer approved — waiting for CI to finish…"
            gh pr checks "$PR" --watch --interval 15 || true
            echo "🤝 Squash-merging PR #$PR"
            gh pr merge "$PR" --squash --delete-branch
          else
            echo "🛠️ Reviewer requested changes — not merging."
          fi
