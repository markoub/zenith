name: 🧭 Analyst — groom requirements into issues

# Wakes when a requirement note changes on main. Reads any requirement whose
# frontmatter is `status: ready` and decomposes it into GitHub issues.
on:
  push:
    branches: [main]
    paths:
      - "vault/02 - Requirements/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  groom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Run the Analyst agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PIPELINE_TOKEN }}
          prompt: |
            You are the Analyst for the Zenith project.
            Read `.github/agents/analyst.md` and follow it exactly.
            Repository: ${{ github.repository }}.
            Before any commit, set:
              git config user.name  "zenith-analyst[bot]"
              git config user.email "zenith-analyst@users.noreply.github.com"
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools Bash,Edit,Read,Write,Glob,Grep
