name: 👩‍💻 Developer — implement issue & open PR

# Wakes when an issue is labeled `ready-for-dev`. Implements the issue on a
# branch, runs the build/tests, and opens a pull request.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run the Developer agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PIPELINE_TOKEN }}
          prompt: |
            You are the Developer for the Zenith project.
            Read `.github/agents/developer.md` and follow it exactly.
            Repository: ${{ github.repository }}.
            Implement GitHub issue #${{ github.event.issue.number }} — "${{ github.event.issue.title }}".
            Before any commit, set:
              git config user.name  "zenith-developer[bot]"
              git config user.email "zenith-developer@users.noreply.github.com"
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools Bash,Edit,Read,Write,Glob,Grep
